  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;ragged-verify-compact&quot; class=&quot;tabular-nums&quot;&gt;
  &lt;style&gt;
    #ragged-verify-compact { color: var(--foreground); }
    #ragged-verify-compact .rv-intro { display:flex; flex-wrap:wrap; gap:8px 20px; margin-bottom:18px; }
    #ragged-verify-compact .rv-controls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin:16px 0; }
    #ragged-verify-compact .rv-planner { margin:14px 0 24px; }
    #ragged-verify-compact .rv-heading { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 18px; margin:14px 0 10px; }
    #ragged-verify-compact .rv-tokens { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:5px; }
    #ragged-verify-compact .rv-token { height:42px; display:flex; align-items:center; justify-content:center; color:var(--foreground); background:color-mix(in srgb,var(--rv-color) 22%,transparent); }
    #ragged-verify-compact .rv-token[data-request=&quot;1&quot;] { --rv-color:var(--viz-series-1); }
    #ragged-verify-compact .rv-token[data-request=&quot;2&quot;] { --rv-color:var(--viz-series-2); }
    #ragged-verify-compact .rv-token[data-request=&quot;3&quot;] { --rv-color:var(--viz-series-3); }
    #ragged-verify-compact .rv-unused { background:color-mix(in srgb,var(--foreground) 6%,transparent); color:var(--muted-foreground); }
    #ragged-verify-compact .rv-padding { background:color-mix(in srgb,var(--foreground) 11%,transparent); }
    #ragged-verify-compact .rv-ranges { margin:8px 0 18px; overflow-wrap:anywhere; }
    #ragged-verify-compact .rv-flow { text-align:center; margin:16px 0; color:var(--muted-foreground); }
    #ragged-verify-compact .rv-buckets { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0 20px; }
    #ragged-verify-compact .rv-bucket { display:flex; flex-direction:column; gap:3px; min-width:62px; text-align:center; }
    #ragged-verify-compact .rv-bucket-mark { height:7px; background:var(--muted); }
    #ragged-verify-compact .rv-bucket[data-selected=&quot;true&quot;] .rv-bucket-mark { background:var(--foreground); }
    #ragged-verify-compact .rv-bucket[data-selected=&quot;true&quot;] { font-weight:500; }
    #ragged-verify-compact .rv-legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin:18px 0; }
    #ragged-verify-compact .rv-legend span { display:flex; align-items:center; gap:6px; }
    #ragged-verify-compact .rv-swatch { width:14px; height:14px; background:color-mix(in srgb,var(--rv-color) 22%,transparent); }
    #ragged-verify-compact .rv-state { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px 24px; margin-top:12px; }
    #ragged-verify-compact .rv-state code { overflow-wrap:anywhere; white-space:normal; }
    #ragged-verify-compact .rv-state-label { margin-bottom:5px; }
    #ragged-verify-compact .rv-caption { margin:16px 0 0; }
    @media(max-width:580px) {
      #ragged-verify-compact .rv-tokens { grid-template-columns:repeat(4,minmax(0,1fr)); }
      #ragged-verify-compact .rv-controls { grid-template-columns:1fr; gap:12px; }
      #ragged-verify-compact .rv-state { grid-template-columns:1fr; }
    }
  &lt;/style&gt;
  &lt;h2&gt;Verify 图：请求档位 → token 档位&lt;/h2&gt;
  &lt;div class=&quot;rv-intro text-small&quot;&gt;
    &lt;span&gt;dSpark Target · CUDA · Full Graph · 无 DP&lt;/span&gt;
    &lt;span&gt;W = 4（含 anchor）&lt;/span&gt;
    &lt;span&gt;capture_bs = [1, 2, 3, 4]&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rv-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rv-len-1&quot;&gt;R1 验证长度：&lt;output id=&quot;rv-value-1&quot;&gt;4&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;rv-len-1&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;4&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rv-len-2&quot;&gt;R2 验证长度：&lt;output id=&quot;rv-value-2&quot;&gt;2&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;rv-len-2&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rv-len-3&quot;&gt;R3 验证长度：&lt;output id=&quot;rv-value-3&quot;&gt;1&lt;/output&gt;&lt;input class=&quot;form-range&quot; id=&quot;rv-len-3&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;4&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rv-planner&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rv-floor&quot;&gt;Planner 档位下限场景&lt;select class=&quot;form-select&quot; id=&quot;rv-floor&quot;&gt;&lt;option value=&quot;budget&quot;&gt;预算下限（示例：等于本批有效行数）&lt;/option&gt;&lt;option value=&quot;full&quot;&gt;完整块下限（3 × 4 = 12 行）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rv-heading&quot;&gt;&lt;span&gt;定宽路径 · 每请求固定 4 行&lt;/span&gt;&lt;span&gt;Graph size = 3 个请求 · 12 行&lt;/span&gt;&lt;/div&gt;
  &lt;div id=&quot;rv-dense&quot; class=&quot;rv-tokens&quot; role=&quot;img&quot; aria-label=&quot;定宽排列：三个请求各占四行&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;rv-ranges text-small&quot;&gt;R1：[0,4)　R2：[4,8)　R3：[8,12)&lt;/div&gt;
  &lt;div class=&quot;rv-flow&quot;&gt;↓ 保留每请求选定的前缀行，连续拼接，再补齐图档位 ↓&lt;/div&gt;
  &lt;div class=&quot;rv-heading&quot;&gt;&lt;span&gt;Compact 路径 · 请求边界由 metadata 描述&lt;/span&gt;&lt;span id=&quot;rv-compact-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div id=&quot;rv-compact&quot; class=&quot;rv-tokens&quot; role=&quot;img&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;rv-ranges text-small&quot; id=&quot;rv-boundaries&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;rv-heading&quot;&gt;&lt;span&gt;预先捕获的 token 档位&lt;/span&gt;&lt;span id=&quot;rv-selected-key&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;rv-buckets&quot; id=&quot;rv-buckets&quot; role=&quot;img&quot; aria-label=&quot;可用图档位为4、8、12、16个token&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;rv-legend text-small&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;rv-swatch&quot; style=&quot;--rv-color:var(--viz-series-1)&quot;&gt;&lt;/i&gt;R1&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;rv-swatch&quot; style=&quot;--rv-color:var(--viz-series-2)&quot;&gt;&lt;/i&gt;R2&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;rv-swatch&quot; style=&quot;--rv-color:var(--viz-series-3)&quot;&gt;&lt;/i&gt;R3&lt;/span&gt;
    &lt;span&gt;A = anchor&lt;/span&gt;&lt;span&gt;灰色候选 = 定宽仍计算的预算外行&lt;/span&gt;&lt;span&gt;补 = 图档位 padding&lt;/span&gt;
  &lt;/div&gt;
  &lt;hr&gt;
  &lt;div class=&quot;rv-state&quot;&gt;
    &lt;div&gt;&lt;div class=&quot;rv-state-label&quot;&gt;真实请求布局&lt;/div&gt;&lt;code id=&quot;rv-lens&quot;&gt;&lt;/code&gt;&lt;br&gt;&lt;code id=&quot;rv-indptr&quot;&gt;&lt;/code&gt;&lt;/div&gt;
    &lt;div&gt;&lt;div class=&quot;rv-state-label&quot;&gt;所选图的固定形状&lt;/div&gt;&lt;code id=&quot;rv-graph-shape&quot;&gt;&lt;/code&gt;&lt;br&gt;&lt;code id=&quot;rv-capture-lens&quot;&gt;&lt;/code&gt;&lt;br&gt;&lt;code id=&quot;rv-padded-lens&quot;&gt;&lt;/code&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;rv-status&quot; class=&quot;rv-caption&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ragged-verify-compact&#x27;);
      const el = id =&gt; root.querySelector(&#x27;#&#x27; + id);
      const lengths = [1,2,3].map(i =&gt; el(&#x27;rv-len-&#x27; + i));
      const buckets = [4,8,12,16];
      const dense = el(&#x27;rv-dense&#x27;);
      const compact = el(&#x27;rv-compact&#x27;);
      const tokens = [];
      for (let req = 1; req &lt;= 3; req++) {
        for (let col = 0; col &lt; 4; col++) {
          const label = &#x27;R&#x27; + req + &#x27;·&#x27; + (col === 0 ? &#x27;A&#x27; : col);
          const tip = &#x27;请求 R&#x27; + req + &#x27;，&#x27; + (col === 0 ? &#x27;anchor&#x27; : &#x27;第 &#x27; + col + &#x27; 个候选 token&#x27;);
          const node = document.createElement(&#x27;div&#x27;);
          node.className = &#x27;rv-token&#x27;;
          node.dataset.request = String(req);
          node.dataset.tooltip = tip;
          node.textContent = label;
          dense.appendChild(node);
          const packed = node.cloneNode(true);
          compact.appendChild(packed);
          tokens.push({ req, col, node, packed });
        }
      }
      const pads = [];
      for (let i = 0; i &lt; 12; i++) {
        const node = document.createElement(&#x27;div&#x27;);
        node.className = &#x27;rv-token rv-padding&#x27;;
        node.textContent = &#x27;补&#x27;;
        node.dataset.tooltip = &#x27;补齐图档位的 token 行，不计入真实 verify_lens&#x27;;
        compact.appendChild(node);
        pads.push(node);
      }
      const bucketNodes = buckets.map(size =&gt; {
        const node = document.createElement(&#x27;div&#x27;);
        node.className = &#x27;rv-bucket&#x27;;
        node.innerHTML = &#x27;&lt;span class=&quot;rv-bucket-mark&quot;&gt;&lt;/span&gt;&lt;span&gt;&#x27; + size + &#x27; tokens&lt;/span&gt;&#x27;;
        el(&#x27;rv-buckets&#x27;).appendChild(node);
        return node;
      });
      let rendered = false;
      function draw() {
        const before = new Map(tokens.filter(t =&gt; !t.packed.hidden).map(t =&gt; [t.packed, t.packed.getBoundingClientRect()]));
        const lens = lengths.map(input =&gt; Number(input.value));
        const total = lens.reduce((sum, n) =&gt; sum + n, 0);
        const floor = el(&#x27;rv-floor&#x27;).value === &#x27;full&#x27; ? 12 : total;
        const tier = buckets.find(n =&gt; n &gt;= Math.max(total, floor));
        const slots = Math.min(tier, 4);
        const base = Math.floor(tier / slots);
        const rem = tier % slots;
        const captureLens = Array.from({length:slots}, (_,i) =&gt; base + (i &lt; rem ? 1 : 0));
        const indptr = [0];
        lens.forEach(n =&gt; indptr.push(indptr[indptr.length - 1] + n));
        lengths.forEach((input,i) =&gt; el(&#x27;rv-value-&#x27; + (i+1)).textContent = input.value);
        tokens.forEach(t =&gt; {
          const active = t.col &lt; lens[t.req - 1];
          t.node.classList.toggle(&#x27;rv-unused&#x27;, !active);
          t.packed.hidden = !active;
          t.packed.style.display = active ? &#x27;flex&#x27; : &#x27;none&#x27;;
        });
        pads.forEach((node,i) =&gt; { node.hidden = i &gt;= tier-total; node.style.display = node.hidden ? &#x27;none&#x27; : &#x27;flex&#x27;; });
        bucketNodes.forEach((node,i) =&gt; node.dataset.selected = String(buckets[i] === tier));
        el(&#x27;rv-compact-count&#x27;).textContent = total + &#x27; 有效 + &#x27; + (tier-total) + &#x27; 补齐 = &#x27; + tier + &#x27; 行&#x27;;
        el(&#x27;rv-selected-key&#x27;).textContent = &#x27;ShapeKey.size = &#x27; + tier + &#x27;（token）&#x27;;
        el(&#x27;rv-boundaries&#x27;).textContent = lens.map((n,i) =&gt; &#x27;R&#x27; + (i+1) + &#x27;：[&#x27; + indptr[i] + &#x27;,&#x27; + indptr[i+1] + &#x27;)&#x27;).join(&#x27;　&#x27;);
        el(&#x27;rv-lens&#x27;).textContent = &#x27;verify_lens = [&#x27; + lens.join(&#x27;, &#x27;) + &#x27;]&#x27;;
        el(&#x27;rv-indptr&#x27;).textContent = &#x27;qo_indptr = [&#x27; + indptr.join(&#x27;, &#x27;) + &#x27;]&#x27;;
        el(&#x27;rv-graph-shape&#x27;).textContent = tier + &#x27; token 行 / &#x27; + slots + &#x27; 捕获请求槽位&#x27;;
        el(&#x27;rv-capture-lens&#x27;).textContent = &#x27;捕获用 dummy 长度 = [&#x27; + captureLens.join(&#x27;, &#x27;) + &#x27;]&#x27;;
        el(&#x27;rv-padded-lens&#x27;).textContent = &#x27;FA 重放补齐长度 = [&#x27; + lens.concat([tier-total]).join(&#x27;, &#x27;) + &#x27;]&#x27;;
        el(&#x27;rv-status&#x27;).textContent = &#x27;本例下限 &#x27; + floor + &#x27; 行 → 选中 &#x27; + tier + &#x27;-token 图；相对定宽少 &#x27; + (12-tier) + &#x27; 个模型输入行。&#x27;;
        compact.setAttribute(&#x27;aria-label&#x27;, &#x27;Compact 排列：验证长度 &#x27; + lens.join(&#x27;、&#x27;) + &#x27;，&#x27; + total + &#x27; 个有效 token 加 &#x27; + (tier-total) + &#x27; 个 padding，使用 &#x27; + tier + &#x27;-token 图。&#x27;);
        root.dataset.total = String(total);
        root.dataset.tier = String(tier);
        root.dataset.slots = String(slots);
        if (rendered &amp;&amp; !matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) {
